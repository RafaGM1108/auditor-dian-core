[project]
name = "auditor-dian-core"
version = "0.5.0"
description = "Lee facturas electrónicas DIAN recibidas y las convierte en una base consultable e informes para el contador. Local y de solo lectura."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "rafael", email = "114042129+RafaGM1108@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "lxml>=5",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "pydantic>=2",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://rafagm1108.github.io/auditor-dian-core/"
Repository = "https://github.com/RafaGM1108/auditor-dian-core"
Issues = "https://github.com/RafaGM1108/auditor-dian-core/issues"

[project.scripts]
auditor = "auditor_dian.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "auditor_dian"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
