name: Página

# Publica site/ en GitHub Pages. El logo y el GIF se copian de donde ya viven en el repo.
on:
  push:
    branches: [master]
    paths: [site/**, docs/img/**, src/auditor_dian/logo.svg, .github/workflows/pagina.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagina
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp src/auditor_dian/logo.svg docs/img/demo-claude-code.gif site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: despliegue
        uses: actions/deploy-pages@v4
